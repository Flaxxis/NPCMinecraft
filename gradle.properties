org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

## Environment properties

# The Minecraft version. The Forge version must agree with it to get a valid artifact.
minecraft_version=26.3
# Bound to the installed client build; any release of 26.3 can be used as a bound.
minecraft_version_range=[26.3,26.4)
# The Forge build. Latest builds are at https://files.minecraftforge.net/
forge_version=66.0.2
forge_version_range=[66,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[66,)

## Mod properties

# The unique mod identifier. Lowercase, matches the String constant in the class annotated with @Mod.
mod_id=npchelper
mod_name=NPC Helpers
mod_license=All Rights Reserved
mod_version=0.0.1
# The group ID. Matches the base package of the mod sources.
mod_group_id=dev.npchelper
mod_authors=Flaxxis
mod_description=Craftable helpers that live and work in a settlement of their own.

# Resource pack format for 26.3.
pack_format_number=121
